name: Research integrity checks

# Full validation of the research pipeline (manuscript/site controls, argument
# graph, adversarial reviews, and the mechanism/capacity generated-artifact
# chain). This runs the complete `validate-all.mjs` suite for signal, but it is
# intentionally SEPARATE from the Pages deploy: an in-progress generated-artifact
# migration should surface here without blocking publication of the website.
# See .github/workflows/pages.yml for the deploy gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare validation log directory
        run: mkdir -p validation-logs
      - name: Run full validation suite
        shell: bash
        run: |
          set -o pipefail
          node scripts/validate-all.mjs 2>&1 | tee validation-logs/validate-all.log
      - name: Regenerate finite-state report for drift diagnosis
        if: always()
        run: |
          node scripts/generate-classification-policy-finite-state-report.mjs --stdout \
            > validation-logs/MECHANISM_PRESERVATION_CLASSIFICATION_POLICY_FINITE_STATE_REPORT.generated.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-integrity-validation-evidence
          path: validation-logs/
          if-no-files-found: error
          retention-days: 30
