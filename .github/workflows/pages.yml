name: Deploy interactive book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The deploy gate validates the PUBLISHED SITE (files, script bindings,
      # internal links, claim controls, and prohibited epistemic overclaims).
      # Full research-artifact integrity (mechanism/capacity generators, etc.)
      # runs separately in research-integrity.yml so the site can still ship
      # while the experimental research pipeline is mid-iteration. Publishing
      # must not be blocked by an in-progress generated-artifact migration.
      - name: Validate the published site
        run: node scripts/validate-site.mjs
      - name: Validate the visual research program
        run: node scripts/validate-program-page.mjs
      - name: Test exact deployment verifier
        run: node scripts/test-verify-pages-deployment.mjs
      - name: Write deployment attestation
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const record = {
            schema_version: 'constructed-subject-pages-deployment-1.0.0',
            repository: process.env.DEPLOY_REPOSITORY,
            commit_sha: process.env.DEPLOY_COMMIT_SHA,
            workflow_run_id: process.env.DEPLOY_RUN_ID,
            workflow_run_attempt: process.env.DEPLOY_RUN_ATTEMPT,
            deployed_at_utc: new Date().toISOString(),
            claim_limits: [
              'This record identifies the repository commit packaged for one GitHub Pages deployment.',
              'It does not validate EGC measurement, QEIB sensitivity, cloud controls, subjectivity, sentience, or consciousness.'
            ]
          };
          fs.writeFileSync('deployment.json', `${JSON.stringify(record, null, 2)}\n`);
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact public deployment
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGES_VERIFY_RETRIES: '18'
          PAGES_VERIFY_DELAY_MS: '10000'
        run: node scripts/verify-pages-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"
